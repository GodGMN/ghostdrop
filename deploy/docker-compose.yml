# Self-hosted Ghostdrop: backend, frontend and a Caddy reverse proxy that serves
# both on one origin. Usage: cp .env.example .env, edit it, docker compose up -d
# Uses the published images. In a checkout, docker-compose.override.yml builds
# from source instead.
name: ghostdrop

services:
  backend:
    image: ghcr.io/godgmn/ghostdrop-backend:${GHOSTDROP_VERSION:-latest}
    restart: unless-stopped
    environment:
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:8080}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-104857600}
      MAX_TOTAL_BYTES: ${MAX_TOTAL_BYTES:-}
      CLEANUP_INTERVAL_MS: ${CLEANUP_INTERVAL_MS:-60000}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
      UPLOAD_PASSWORD_HASH: ${UPLOAD_PASSWORD_HASH:-}
      UPLOAD_ALLOWED_IPS: ${UPLOAD_ALLOWED_IPS:-}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_REGION: ${S3_REGION:-}
      S3_PREFIX: ${S3_PREFIX:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - ghostdrop-data:/app/data

  frontend:
    image: ghcr.io/godgmn/ghostdrop-frontend:${GHOSTDROP_VERSION:-latest}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    environment:
      GHOSTDROP_SITE: ${GHOSTDROP_SITE:-http://localhost}
    ports:
      - ${HTTP_PORT:-8080}:80
      - ${HTTPS_PORT:-8443}:443
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  ghostdrop-data:
  caddy-data:
  caddy-config:
